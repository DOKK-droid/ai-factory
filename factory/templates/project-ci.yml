# Plantilla de CI para un proyecto nuevo. El job se llama `ci`: ese es el nombre
# que exige el ruleset (cambialo con --check-name en onboard-project.sh). Adapta los pasos al stack.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
